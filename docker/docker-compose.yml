services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: project_x_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: project_x_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    
  minio-create-bucket:
    image: minio/mc
    container_name: project_x_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/agentdesk-dev || true;
      exit 0;
      "

  redis:
    image: redis:7-alpine
    container_name: project_x_redis
    ports:
      - '6379:6379'
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
